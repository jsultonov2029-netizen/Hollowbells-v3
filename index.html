<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hollowbell</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #05040b;
      color: #ffffff;
      font-family: "Courier New", Courier, Consolas, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #canvas-container {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    canvas#gameCanvas {
      background: #000000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 28px rgba(200, 160, 60, 0.22);
      border: 2px solid #2b2546;
      border-radius: 6px;
      display: block;
    }
    /* Responsive Touch Controls for Mobile / Tablet */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 680px;
      padding: 8px 14px 14px 14px;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
      z-index: 20;
    }
    @media (hover: none) and (pointer: coarse), (max-width: 768px) {
      #touch-controls {
        display: flex;
      }
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
    }
    .dpad-btn {
      background: rgba(34, 30, 56, 0.88);
      border: 2px solid #6b5e99;
      border-radius: 10px;
      color: #e8e2ff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: #c8a03c;
      color: #000;
      border-color: #ffe63c;
    }
    .dpad-empty {
      pointer-events: none;
    }
    .sys-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .sys-btn {
      background: rgba(28, 25, 44, 0.88);
      border: 2px solid #59527a;
      border-radius: 8px;
      color: #ccc;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      padding: 8px 12px;
      touch-action: none;
    }
    .sys-btn:active, .sys-btn.active {
      background: #c8a03c;
      color: #000;
    }
    .action-pad {
      display: grid;
      grid-template-columns: repeat(2, 54px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      align-items: center;
      justify-items: center;
    }
    .act-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #c8a03c;
      background: rgba(42, 34, 62, 0.9);
      color: #ffe63c;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .act-btn span {
      font-size: 9px;
      color: #bbb;
      margin-top: 1px;
    }
    .act-btn:active, .act-btn.active {
      background: #ffe63c;
      color: #000;
    }
    .act-btn:active span, .act-btn.active span {
      color: #222;
    }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <div id="canvas-container">
      <canvas id="gameCanvas" width="640" height="480"></canvas>
    </div>
    <div id="touch-controls">
      <div class="dpad">
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowUp">▲</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowLeft">◀</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowRight">▶</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowDown">▼</button>
        <div class="dpad-empty"></div>
      </div>
      <div class="sys-btns">
        <button class="sys-btn" data-key="KeyC">MENU (C)</button>
        <button class="sys-btn" data-key="KeyM">MUTE (M)</button>
      </div>
      <div class="action-pad">
        <button class="act-btn" data-key="KeyX">X<span>BACK</span></button>
        <button class="act-btn" data-key="KeyZ">Z<span>OK</span></button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // 1. CONSTANTS, PALETTE & INPUT DEFINITIONS
  // =========================================================================
  const W = 640, H = 480;
  const TILE = 32;
  const COLS = W / TILE, ROWS = H / TILE;

  const BLACK  = [0, 0, 0];
  const WHITE  = [255, 255, 255];
  const YELLOW = [255, 230, 60];
  const ORANGE = [255, 140, 0];
  const RED    = [255, 0, 0];
  const BLUE   = [70, 110, 255];
  const GREEN  = [60, 220, 90];
  const GREY   = [110, 110, 110];
  const NIGHT  = [12, 10, 30];
  const MOON   = [230, 230, 200];
  const RIDGE  = [28, 24, 56];
  const BELL   = [200, 160, 60];

  const GAME_VERSION = "1.3.0";
  const NAME_MAX = 8;
  const RESERVED_NAMES = new Set([
    "WICK", "HUSH", "PIP", "BRAMBLE", "QUILLBY", "CINDER", "MOSSBACK", "CLINKER",
    "MARROW", "TANSY", "FENNICK", "RIPPLE", "DUSK", "VEIL", "HEARTROOT", "STONEWHISTLE"
  ]);

  const CONFIRM_KEYS = new Set(["KeyZ", "Enter", "Space", "NumpadEnter"]);
  const SKIP_KEYS    = new Set(["KeyX", "ShiftLeft", "ShiftRight"]);
  const BACK_KEYS    = new Set(["KeyX", "ShiftLeft", "ShiftRight", "Backspace"]);
  const PAUSE_KEYS   = new Set(["KeyC", "Tab"]);
  const LEFT_KEYS    = new Set(["ArrowLeft", "KeyA"]);
  const RIGHT_KEYS   = new Set(["ArrowRight", "KeyD"]);
  const UP_KEYS      = new Set(["ArrowUp", "KeyW"]);
  const DOWN_KEYS    = new Set(["ArrowDown", "KeyS"]);

  const keysDown = new Set();

  function rgb(c, a = 1) {
    if (typeof c === "string") return c;
    if (a < 1) return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function fontStr(size) {
    return `bold ${size}px "Courier New", Courier, Consolas, monospace`;
  }

  // =========================================================================
  // 2. CANVAS DRAWING HELPERS & TEXT WRAPPING
  // =========================================================================
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function measureText(text, size) {
    ctx.font = fontStr(size);
    return ctx.measureText(text).width;
  }

  function wrap(text, size, width) {
    const lines = [];
    for (const paragraph of String(text).split("\n")) {
      let cur = "";
      for (const word of paragraph.split(" ")) {
        const test = cur ? cur + " " + word : word;
        if (measureText(test, size) <= width) {
          cur = test;
        } else {
          lines.push(cur);
          cur = word;
        }
      }
      lines.push(cur);
    }
    return lines;
  }

  function paginate(text, size, width, maxLines) {
    const lines = wrap(text, size, width);
    const pages = [];
    for (let i = 0; i < lines.length; i += maxLines) {
      pages.push(lines.slice(i, i + maxLines).join("\n"));
    }
    return pages.length ? pages : [""];
  }

  function drawText(c, text, x, y, size, color = WHITE, align = "left", alpha = 1) {
    if (!text) return;
    c.save();
    c.globalAlpha = Math.max(0, Math.min(1, alpha));
    c.font = fontStr(size);
    c.fillStyle = rgb(color);
    c.textBaseline = "top";
    c.textAlign = align;
    c.fillText(text, Math.round(x), Math.round(y));
    c.restore();
  }

  function drawTextCenter(c, text, cx, cy, size, color = WHITE, alpha = 1) {
    if (!text) return;
    c.save();
    c.globalAlpha = Math.max(0, Math.min(1, alpha));
    c.font = fontStr(size);
    c.fillStyle = rgb(color);
    c.textBaseline = "middle";
    c.textAlign = "center";
    c.fillText(text, Math.round(cx), Math.round(cy));
    c.restore();
  }

  function drawTyped(c, size, text, shown, x, y, lh, color = WHITE) {
    let remaining = shown;
    for (const line of text.split("\n")) {
      const part = line.slice(0, Math.max(0, remaining));
      remaining -= line.length + 1;
      if (part) {
        drawText(c, part, x, y, size, color);
      }
      y += lh;
    }
  }

  function fillRect(c, x, y, w, h, color, alpha = 1) {
    c.save();
    c.globalAlpha = alpha;
    c.fillStyle = rgb(color);
    c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    c.restore();
  }

  function strokeRect(c, x, y, w, h, color, lw = 1) {
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    const off = (lw % 2 === 1) ? 0.5 : 0;
    c.strokeRect(Math.round(x) + off, Math.round(y) + off, Math.round(w), Math.round(h));
    c.restore();
  }

  function fillCircle(c, cx, cy, r, color) {
    if (r <= 0) return;
    c.save();
    c.fillStyle = rgb(color);
    c.beginPath();
    c.arc(Math.round(cx), Math.round(cy), r, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function strokeCircle(c, cx, cy, r, color, lw = 1) {
    if (r <= 0) return;
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    c.beginPath();
    c.arc(Math.round(cx), Math.round(cy), r, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }

  function fillEllipse(c, x, y, w, h, color) {
    if (w <= 0 || h <= 0) return;
    c.save();
    c.fillStyle = rgb(color);
    c.beginPath();
    c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function strokeEllipse(c, x, y, w, h, color, lw = 1) {
    if (w <= 0 || h <= 0) return;
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    c.beginPath();
    c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }

  function strokeArc(c, x, y, w, h, startAng, endAng, color, lw = 1) {
    if (w <= 0 || h <= 0) return;
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    c.beginPath();
    // Pygame arc angles are counterclockwise from +x; canvas is clockwise
    c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, -endAng, -startAng);
    c.stroke();
    c.restore();
  }

  function fillPolygon(c, pts, color) {
    if (!pts.length) return;
    c.save();
    c.fillStyle = rgb(color);
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
    c.fill();
    c.restore();
  }

  function drawLine(c, p1, p2, color, lw = 1) {
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    c.beginPath();
    c.moveTo(p1[0], p1[1]);
    c.lineTo(p2[0], p2[1]);
    c.stroke();
    c.restore();
  }

  function drawLines(c, pts, color, lw = 1) {
    if (pts.length < 2) return;
    c.save();
    c.strokeStyle = rgb(color);
    c.lineWidth = lw;
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
    c.restore();
  }

  function drawPanel(c, rect, border = WHITE) {
    fillRect(c, rect.x, rect.y, rect.w, rect.h, BLACK);
    strokeRect(c, rect.x, rect.y, rect.w, rect.h, border, 4);
  }

  function drawHeart(c, x, y, size = 8, color = RED) {
    const r = size * 0.55;
    fillCircle(c, x - size * 0.5, y - size * 0.3, r, color);
    fillCircle(c, x + size * 0.5, y - size * 0.3, r, color);
    fillPolygon(c, [
      [x - size * 1.03, y - size * 0.05],
      [x + size * 1.03, y - size * 0.05],
      [x, y + size * 1.0]
    ], color);
  }

  function drawMenuList(c, size, labels, sub, x, y, lh, rows = 3) {
    let start = 0;
    if (labels.length > rows) {
      start = Math.min(Math.max(0, sub - rows + 1), labels.length - rows);
    }
    const slice = labels.slice(start, start + rows);
    slice.forEach((label, n) => {
      drawText(c, "* " + label, x, y + n * lh, size, WHITE);
    });
    drawHeart(c, x - 20, y + (sub - start) * lh + 10, 7);
    if (start > 0) {
      fillPolygon(c, [[x + 440, y + 6], [x + 450, y + 6], [x + 445, y - 2]], GREY);
    }
    if (start + rows < labels.length) {
      fillPolygon(c, [
        [x + 440, y + rows * lh - 8],
        [x + 450, y + rows * lh - 8],
        [x + 445, y + rows * lh]
      ], GREY);
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function rectContainsPoint(r, px, py) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  function inflateRect(r, dw, dh) {
    return { x: r.x - dw / 2, y: r.y - dh / 2, w: r.w + dw, h: r.h + dh };
  }

  // =========================================================================
  // 3. PROCEDURAL WEB AUDIO CHIPTUNE SYNTHESIZER & SFX
  // =========================================================================
  function hz(midi) {
    return 440.0 * Math.pow(2, (midi - 69) / 12);
  }

  const TRACKS = {
    title:   [[69, 0, 72, 0, 76, 0, 72, 0, 67, 0, 71, 0, 74, 0, 71, 0],
              [45, 45, 43, 43, 41, 41, 43, 43], 0.32, "tri", 0.20],
    cave:    [[57, 0, 60, 0, 64, 0, 60, 0, 55, 0, 59, 0, 62, 0, 59, 0],
              [33, 33, 31, 31, 29, 29, 31, 31], 0.45, "tri", 0.22],
    battle:  [[76, 0, 76, 72, 0, 72, 69, 72, 74, 0, 74, 71, 0, 71, 67, 71,
               76, 76, 0, 79, 76, 0, 72, 69, 71, 72, 74, 76, 74, 72, 71, 0],
              [45, 45, 41, 41, 43, 43, 40, 40, 45, 45, 41, 41, 43, 43, 47, 47],
              0.14, "square", 0.12],
    boss:    [[64, 64, 0, 64, 63, 0, 64, 67, 0, 64, 64, 0, 62, 0, 60, 59,
               64, 64, 0, 64, 66, 0, 67, 71, 0, 69, 67, 0, 66, 0, 64, 0],
              [40, 40, 40, 40, 38, 38, 38, 38, 36, 36, 36, 36, 35, 35, 35, 35],
              0.12, "square", 0.12],
    shop:    [[72, 76, 79, 76, 72, 76, 79, 84, 71, 74, 79, 74, 71, 74, 79, 83],
              [48, 48, 43, 43, 47, 47, 43, 43], 0.22, "square", 0.10],
    ending:  [[72, 0, 76, 79, 0, 76, 72, 0, 69, 0, 72, 76, 0, 72, 69, 0],
              [48, 48, 45, 45, 41, 41, 43, 43], 0.40, "tri", 0.22],
    roots:   [[62, 0, 65, 0, 69, 0, 65, 0, 60, 0, 64, 0, 67, 0, 64, 0],
              [38, 38, 36, 36, 34, 34, 36, 36], 0.40, "tri", 0.22],
    quiet:   [[60, 0, 0, 64, 0, 0, 67, 0, 65, 0, 0, 62, 0, 0, 59, 0],
              [36, 36, 31, 31, 33, 33, 31, 31], 0.50, "tri", 0.20],
    forge:   [[57, 0, 57, 60, 0, 57, 0, 55, 57, 0, 57, 62, 0, 60, 0, 57,
               55, 0, 55, 58, 0, 55, 0, 53, 55, 0, 55, 60, 0, 58, 0, 55],
              [33, 33, 33, 33, 31, 31, 31, 31, 29, 29, 29, 29, 31, 31, 31, 31],
              0.18, "square", 0.11],
    heart:   [[69, 0, 72, 69, 0, 72, 76, 0, 74, 72, 0, 69, 67, 0, 69, 0,
               69, 0, 72, 69, 0, 72, 77, 0, 76, 74, 0, 72, 71, 0, 69, 0],
              [45, 45, 45, 45, 43, 43, 43, 43, 41, 41, 41, 41, 40, 40, 43, 43],
              0.11, "square", 0.12],
    orchard: [[67, 0, 71, 74, 0, 71, 67, 0, 69, 0, 72, 76, 0, 72, 69, 0],
              [43, 43, 48, 48, 45, 45, 50, 50], 0.30, "tri", 0.20],
    village: [[74, 78, 81, 78, 74, 78, 81, 86, 73, 76, 81, 76, 73, 76, 81, 85],
              [50, 50, 45, 45, 49, 49, 45, 45], 0.20, "square", 0.09],
    summit:  [[72, 0, 75, 72, 0, 75, 79, 0, 77, 75, 0, 72, 70, 0, 72, 0,
               72, 0, 75, 72, 0, 75, 80, 0, 79, 77, 0, 75, 74, 0, 72, 0],
              [48, 48, 48, 48, 46, 46, 46, 46, 44, 44, 44, 44, 43, 43, 46, 46],
              0.10, "square", 0.12],
  };

  class WebAudioSynth {
    constructor() {
      this.ctx = null;
      this.masterGain = null;
      this.musicGain = null;
      this.sfxGain = null;
      this.muted = false;
      this.currentTrack = null;
      this.musicSource = null;
      this.trackBuffers = {};
      this.sfxBuffers = {};
      this.rate = 22050;
      this.initialized = false;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.rate = this.ctx.sampleRate || 22050;
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = this.muted ? 0 : 1;
        this.masterGain.connect(this.ctx.destination);

        this.musicGain = this.ctx.createGain();
        this.musicGain.gain.value = 0.5;
        this.musicGain.connect(this.masterGain);

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.65;
        this.sfxGain.connect(this.masterGain);

        this._buildSfx();
        this.initialized = true;
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume();
      }
      if (this.currentTrack && !this.musicSource && this.initialized) {
        const name = this.currentTrack;
        this.currentTrack = null;
        this.playMusic(name);
      }
    }

    _wave(freq, dur, vol = 0.3, kind = "square", decay = 1.0) {
      const n = Math.floor(this.rate * dur);
      const out = new Float32Array(n);
      if (kind !== "noise" && freq <= 0) return out;
      const step = freq / this.rate;
      let ph = 0.0;
      for (let i = 0; i < n; i++) {
        ph = (ph + step) % 1.0;
        let v = 0;
        if (kind === "square") v = ph < 0.5 ? 1.0 : -1.0;
        else if (kind === "tri") v = 4 * Math.abs(ph - 0.5) - 1;
        else if (kind === "saw") v = 2 * ph - 1;
        else v = Math.random() * 2 - 1;
        let env = 1.0 - decay * (i / n);
        if (i < 40) env *= i / 40;
        out[i] = v * vol * env;
      }
      return out;
    }

    _seq(notes, vol = 0.25, kind = "square", decay = 0.5) {
      const parts = notes.map(([f, d]) => this._wave(f, d, vol, kind, decay));
      const total = parts.reduce((acc, p) => acc + p.length, 0);
      const out = new Float32Array(total);
      let off = 0;
      for (const p of parts) {
        out.set(p, off);
        off += p.length;
      }
      return out;
    }

    _mix(a, b) {
      const n = Math.max(a.length, b.length);
      const out = new Float32Array(n);
      for (let i = 0; i < a.length; i++) out[i] = a[i];
      for (let i = 0; i < b.length; i++) {
        out[i] = Math.max(-1, Math.min(1, out[i] + b[i]));
      }
      return out;
    }

    _toBuffer(arr) {
      const buf = this.ctx.createBuffer(1, arr.length, this.rate);
      buf.getChannelData(0).set(arr);
      return buf;
    }

    _buildSfx() {
      const w = this._wave.bind(this);
      const s = this._seq.bind(this);
      const m = this._mix.bind(this);
      const add = (name, arr, vol = 0.6) => {
        for (let i = 0; i < arr.length; i++) arr[i] *= vol;
        this.sfxBuffers[name] = this._toBuffer(arr);
      };

      add("blip",     w(520, 0.03, 0.10, "square", 0.6), 0.5);
      add("blip_low", w(290, 0.035, 0.12, "square", 0.6), 0.5);
      add("select",   w(760, 0.05, 0.15, "square", 0.5));
      add("confirm",  s([[660, 0.05], [990, 0.08]], 0.15));
      add("hit",      m(w(0, 0.14, 0.35, "noise", 1.0), w(140, 0.14, 0.3, "square", 1.0)));
      add("slash",    w(0, 0.22, 0.3, "noise", 1.0));
      add("heal",     s([[523, 0.06], [659, 0.06], [784, 0.06], [1047, 0.12]], 0.25, "tri"));
      add("buy",      s([[880, 0.05], [1320, 0.09]], 0.18));

    }

    _getTrackBuffer(name) {
      if (!this.trackBuffers[name]) {
        const [melody, bass, step, kind, vol] = TRACKS[name];
        const melParts = melody.map(n => this._wave(n ? hz(n) : 0, step, vol, kind, 0.6));
        const bassParts = bass.map(n => this._wave(n ? hz(n) : 0, step * 2, 0.22, "tri", 0.2));
        const melLen = melParts.reduce((a, b) => a + b.length, 0);
        const bassLen = bassParts.reduce((a, b) => a + b.length, 0);
        const mel = new Float32Array(melLen);
        let o = 0;
        for (const p of melParts) { mel.set(p, o); o += p.length; }
        const bs = new Float32Array(bassLen);
        o = 0;
        for (const p of bassParts) { bs.set(p, o); o += p.length; }
        this.trackBuffers[name] = this._toBuffer(this._mix(mel, bs));
      }
      return this.trackBuffers[name];
    }

    sfx(name) {
      if (!this.initialized || this.muted || !this.sfxBuffers[name]) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.sfxBuffers[name];
      src.connect(this.sfxGain);
      src.start();
    }

    playMusic(name) {
      if (name === this.currentTrack && (name === null || this.musicSource)) return;
      this.currentTrack = name;
      if (this.musicSource) {
        try { this.musicSource.stop(); } catch (_) {}
        this.musicSource = null;
      }
      if (!name || !this.initialized) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this._getTrackBuffer(name);
      src.loop = true;
      src.connect(this.musicGain);
      src.start();
      this.musicSource = src;
    }

    toggleMute() {
      this.muted = !this.muted;
      if (this.masterGain) {
        this.masterGain.gain.value = this.muted ? 0 : 1;
      }
    }
  }

  class Typewriter {
    constructor(text, speed = 30, voice = null) {
      this.text = text;
      this.speed = speed;
      this.timer = 0.0;
      this.voice = voice;
      this._last = 0;
    }
    get shown() {
      return Math.min(this.text.length, Math.floor(this.timer * this.speed));
    }
    get done() {
      return this.shown >= this.text.length;
    }
    update(dt) {
      this.timer += dt;
      const n = this.shown;
      if (this.voice && n > this._last) {
        const ch = this.text[n - 1];
        if (ch !== " " && ch !== "\n" && n % 2 === 0) {
          AUDIO.sfx(this.voice);
        }
      }
      this._last = n;
    }
    finish() {
      this.timer = this.text.length / this.speed;
      this._last = this.text.length;
    }
  }

  function drawHeartroot(c, cx, cy, t, s = 1) {
    const beat = 1 + 0.06 * Math.sin(t * 4);
    const S = s * beat;
    const core = [200, 40, 85], glow = [255, 150, 190];
    for (let i = 0; i < 7; i++) {
      const x = cx - Math.trunc(36 * S) + i * Math.trunc(12 * S);
      const sway = Math.sin(t * 2 + i) * 6 * S;
      drawLine(c, [x, cy + Math.trunc(20 * S)], [x + Math.trunc(sway), cy + Math.trunc(52 * S)], [60, 120, 60], Math.max(2, Math.trunc(3 * S)));
    }
    fillCircle(c, cx - Math.trunc(15 * S), cy - Math.trunc(14 * S), Math.trunc(18 * S), core);
    fillCircle(c, cx + Math.trunc(15 * S), cy - Math.trunc(14 * S), Math.trunc(18 * S), core);
    fillPolygon(c, [[cx - Math.trunc(32 * S), cy - Math.trunc(8 * S)], [cx + Math.trunc(32 * S), cy - Math.trunc(8 * S)], [cx, cy + Math.trunc(36 * S)]], core);
    fillCircle(c, cx, cy - Math.trunc(4 * S), Math.trunc(10 * S), glow);
    fillCircle(c, cx, cy - Math.trunc(4 * S), Math.trunc(4 * S), WHITE);
    for (const dx of [-18, 18]) {
      drawLine(c, [cx + Math.trunc(dx * S), cy - Math.trunc(28 * S)], [cx + Math.trunc(dx * S * 0.4), cy + Math.trunc(10 * S)], [60, 140, 70], Math.max(1, Math.trunc(2 * S)));
    }
    for (const ex of [-9, 9]) {
      fillEllipse(c, cx + Math.trunc(ex * S) - Math.trunc(3 * S), cy + Math.trunc(8 * S), Math.trunc(6 * S), Math.trunc(8 * S), [40, 10, 30]);

  }

    if (name === "hat") {
      fillEllipse(c, bx - 14, by - 39, 28, 8, [90, 60, 30]);
      fillPolygon(c, [[bx - 8, by - 37], [bx + 8, by - 37], [bx, by - 54]], [70, 130, 80]);
      fillRect(c, bx - 8, by - 40, 16, 3, [200, 170, 80]);

  function drawKit(c, bx, by, skin, facing = "down", frame = 0) {
    const pal = skin.pal;
    const extra = skin.extra;
    fillEllipse(c, bx - 11, by - 5, 22, 9, BLACK);
    fillRect(c, bx - 7, by - 7 - (frame ? 2 : 0), 5, 7, pal.legs);
    fillRect(c, bx + 2, by - 7 - (frame ? 0 : 2), 5, 7, pal.legs);
    drawSkinExtra(c, extra, bx, by, facing, pal, "pre");
    fillRect(c, bx - 9, by - 21, 18, 15, pal.tunic);
    fillRect(c, bx - 9, by - 22, 18, 4, pal.scarf);
    fillCircle(c, bx, by - 28, 9, pal.skin);
    if (facing === "up") {
      fillCircle(c, bx, by - 28, 9, pal.hair);
    } else {
      fillRect(c, bx - 9, by - 37, 18, 7, pal.hair);
    }
    const eye = pal.eye;
    if (facing === "down") {
      fillRect(c, bx - 5, by - 28, 2, 4, eye);
      fillRect(c, bx + 3, by - 28, 2, 4, eye);
      if (pal.pend) fillCircle(c, bx, by - 15, 3, pal.pend);
    } else if (facing === "left") {
      fillRect(c, bx - 7, by - 28, 2, 4, eye);
    } else if (facing === "right") {
      fillRect(c, bx + 5, by - 28, 2, 4, eye);
    }
    drawSkinExtra(c, extra, bx, by, facing, pal, "post");
  }

  function drawKitBig(c, cx, by, skin, t, s = 2) {
    c.save();
    c.translate(cx - 32 * s, by - 72 * s);
    c.scale(s, s);
    drawKit(c, 32, 72, skin, "down", Math.trunc(t * 4) % 2);
    c.restore();
  }

  function makeMap(blocks = [], doors = null) {
    const grid = Array.from({ length: ROWS }, () => Array(COLS).fill("."));
    for (let x = 0; x < COLS; x++) {
      grid[0][x] = "#";
      grid[ROWS - 1][x] = "#";
    }
    for (let y = 0; y < ROWS; y++) {
      grid[y][0] = "#";
      grid[y][COLS - 1] = "#";
    }
    for (const blk of blocks) {
      const [bx, by, bw, bh] = blk;
      const ch = blk.length > 4 ? blk[4] : "#";
      for (let y = by; y < by + bh; y++) {
        for (let x = bx; x < bx + bw; x++) {
          grid[y][x] = ch;
        }
      }
    }
    if (doors) {
      for (const [coord, ch] of Object.entries(doors)) {
        const [dx, dy] = coord.split(",").map(Number);
        grid[dy][dx] = ch;
      }
    }
    return grid.map(r => r.join(""));
  }

  class Room {
    constructor(key) {
      const data = ROOM_DATA[key];
      this.key = key;
      this.name = data.name;
      this.chapter = data.chapter;
      this.spawn = data.spawn;
      this.music = data.music;
      this.lights = data.lights;
      this.fx = data.fx || null;
      const rows = data.map;
      this.solids = [];
      this.doors = {};
      for (let ty = 0; ty < rows.length; ty++) {
        const row = rows[ty];
        for (let tx = 0; tx < row.length; tx++) {
          const ch = row[tx];
          if (ch === "#" || ch === "~") {
            this.solids.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE });
          } else if (/\d/.test(ch)) {
            this.doors[`${tx},${ty}`] = data.doors[ch];
          }
        }
      }
      this.surface = this._render(data, rows);
    }

    _render(data, rows) {
      const surf = document.createElement("canvas");
      surf.width = W;
      surf.height = H;
      const c = surf.getContext("2d");
      const [floorA, floorB] = data.floor;
      const wall = data.wall;
      const brick = wall.map(v => Math.min(255, v + 14));
      for (let ty = 0; ty < rows.length; ty++) {
        const row = rows[ty];
        for (let tx = 0; tx < row.length; tx++) {
          const ch = row[tx];
          const rx = tx * TILE, ry = ty * TILE;
          if (ch === "#") {
            fillRect(c, rx, ry, TILE, TILE, wall);
            drawLine(c, [rx, ry + TILE / 2], [rx + TILE, ry + TILE / 2], brick, 2);
            const off = (ty % 2) ? 8 : 22;
            drawLine(c, [rx + off, ry], [rx + off, ry + TILE / 2], brick, 2);
          } else if (ch === "~") {
            fillRect(c, rx, ry, TILE, TILE, [30, 72, 124]);
            drawLine(c, [rx + 4, ry + 10], [rx + 14, ry + 10], [70, 120, 180], 2);
            drawLine(c, [rx + 16, ry + 22], [rx + 26, ry + 22], [70, 120, 180], 2);
          } else if (/\d/.test(ch)) {
            fillRect(c, rx, ry, TILE, TILE, BLACK);
            strokeRect(c, rx, ry, TILE, TILE, BELL, 2);
          } else {
            fillRect(c, rx, ry, TILE, TILE, (tx + ty) % 2 === 0 ? floorA : floorB);
          }
        }
      }
      return surf;
    }
  }

  // =========================================================================
  // 8. PLAYER & DIALOGUE BOX
  // =========================================================================
  class Player {
    constructor(tile, skin = null) {
      this.HB_W = 20;
      this.HB_H = 14;
      this.SPEED = 130;
      this.skin = skin || SKINS[0];
      this.place(tile);
      this.facing = "down";
      this.walking = false;
      this.anim = 0.0;
    }

    place(tile) {
      this.x = tile[0] * TILE + TILE / 2;
      this.y = tile[1] * TILE + TILE / 2;
    }

    hitbox() {
      return {
        x: Math.round(this.x) - this.HB_W / 2,
        y: Math.round(this.y) - this.HB_H / 2,
        w: this.HB_W,
        h: this.HB_H
      };
    }

    centerTile() {
      return [Math.floor(this.x / TILE), Math.floor(this.y / TILE)];
    }

    update(dt, solids) {
      const right = keysDown.has("ArrowRight") || keysDown.has("KeyD") ? 1 : 0;
      const left  = keysDown.has("ArrowLeft")  || keysDown.has("KeyA") ? 1 : 0;
      const down  = keysDown.has("ArrowDown")  || keysDown.has("KeyS") ? 1 : 0;
      const up    = keysDown.has("ArrowUp")    || keysDown.has("KeyW") ? 1 : 0;
      let dx = right - left;
      let dy = down - up;
      this.walking = Boolean(dx || dy);
      if (!this.walking) {
        this.anim = 0.0;
        return;
      }
      if (dx && dy) {
        dx *= 0.7071;
        dy *= 0.7071;
      }
      if (dy) this.facing = dy > 0 ? "down" : "up";
      if (dx && !dy) this.facing = dx > 0 ? "right" : "left";
      this.anim += dt;
      this._moveAxis(dx * this.SPEED * dt, 0, solids);
      this._moveAxis(0, dy * this.SPEED * dt, solids);
    }

    _moveAxis(mx, my, solids) {
      this.x += mx;
      this.y += my;
      const box = this.hitbox();
      for (const s of solids) {
        if (rectsOverlap(box, s)) {
          if (mx > 0) box.x = s.x - box.w;
          else if (mx < 0) box.x = s.x + s.w;
          if (my > 0) box.y = s.y - box.h;
          else if (my < 0) box.y = s.y + s.h;
          this.x = box.x + box.w / 2;
          this.y = box.y + box.h / 2;
        }
      }
    }

    draw(c) {
      const bx = Math.trunc(this.x);
      const by = Math.trunc(this.y + this.HB_H / 2);
      const frame = this.walking ? Math.trunc(this.anim * 8) % 2 : 0;
      drawKit(c, bx, by, this.skin, this.facing, frame);
    }
  }

    constructor(speaker, pages, voice = "blip", onClose = null) {
      this.speaker = speaker;

      this.fontSize = 20;
      this.nameSize = 16;
      this.pages = [];
      for (const p of pages) {
        this.pages.push(...paginate(p, this.fontSize, W - 100, 3));
      }
      this.i = 0;
      this.writer = new Typewriter(this.pages[0], 40, voice);
      this.t = 0.0;
    }

    advance() {
      if (!this.writer.done) {
        this.writer.finish();
        return false;
      }
      this.i += 1;
      if (this.i >= this.pages.length) return true;
      this.writer = new Typewriter(this.pages[this.i], 40, this.voice);
      return false;
    }

    update(dt) {
      this.t += dt;
      this.writer.update(dt);
    }

    draw(c, top = false) {
      const rect = { x: 30, y: top ? 20 : 340, w: W - 60, h: 120 };
      drawPanel(c, rect);
      let y = rect.y + 14;
      if (this.speaker) {
        drawText(c, this.speaker, rect.x + 18, rect.y + 10, this.nameSize, YELLOW);
        y = rect.y + 36;
      }
      drawTyped(c, this.fontSize, this.writer.text, this.writer.shown, rect.x + 18, y, 26);
      if (this.writer.done && Math.trunc(this.t * 2) % 2 === 0) {
        const right = rect.x + rect.w;
        const bottom = rect.y + rect.h;
        fillPolygon(c, [[right - 34, bottom - 22], [right - 20, bottom - 22], [right - 27, bottom - 12]], YELLOW);
      }
    }
  }

  class Prop {
    constructor(room, tile, size = [26, 14], solid = true) {
      this.room = room;
      this.tile = tile;
      this.solid = solid;
      this.x = tile[0] * TILE + TILE / 2;
      this.y = tile[1] * TILE + TILE / 2;
      this.rect = {
        x: Math.trunc(this.x) - size[0] / 2,
        y: Math.trunc(this.y) - size[1] / 2,
        w: size[0],
        h: size[1]

    }
    active(game) { return true; }
    interact(ow) {}
    draw(c, t, game) {}
  }

        }
        return ow;

      const leave = () => {
        ow.say("Tansy", ["Come back if you get sleepy!"]);
        return ow;
      };
      const ask = () => {
        g.changeState(new ChoiceState(

          ["Yes, please", "No, thanks"],
          [rest, leave],
          (c, t) => drawTansy(c, 320, 170, t),
          ow.room.music

  class Monster {
    constructor(uid, key, room, tile, roam) {
      this.uid = uid;
      this.key = key;
      this.room = room;
      this.home = [tile[0] * TILE + TILE / 2, tile[1] * TILE + TILE / 2];
      this.roam = roam;
      this.x = this.home[0];
      this.y = this.home[1];
      this.alive = true;
      this.t = Math.random() * 6;
    }

    update(dt) {
      this.t += dt;
      this.x = this.home[0] + Math.sin(this.t * 1.3) * this.roam[0];
      this.y = this.home[1] + Math.sin(this.t * 1.9) * this.roam[1];
    }

    get rect() {
      const [w, h] = ENEMIES[this.key].hitbox;
      return {
        x: Math.trunc(this.x) - w / 2,
        y: Math.trunc(this.y) - h / 2,
        w, h
      };
    }

    draw(c) {
      const d = ENEMIES[this.key];
      const [w, h] = d.hitbox;
      fillEllipse(c, Math.trunc(this.x) - Math.trunc(w / 2), Math.trunc(this.y) + Math.trunc(h / 2) - 4, w, 8, BLACK);
      d.draw(c, Math.trunc(this.x), Math.trunc(this.y), this.t, d.oscale);
    }
  }

  // =========================================================================
  // 11. BULLETS & ALL 17 BULLET PATTERNS
  // =========================================================================
  class Bullet {
    constructor(x, y, vx, vy, r = 5, color = WHITE, opts = {}) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.r = r; this.color = color;
      this.w = opts.w || 0;
      this.h = opts.h || 0;
      this.fuse = opts.fuse !== undefined ? opts.fuse : null;
      this.bounce = Boolean(opts.bounce);
      this.ay = opts.ay || 0.0;
      this.warn = opts.warn || 0.0;
      this.life = opts.life !== undefined ? opts.life : null;
      this.home = opts.home || null;
      this.wave = opts.wave || 0.0;
      this.age = 0.0;
      this.dead = false;
      this.arm_index = null;
    }

    update(dt, inner) {
      const spawned = [];
      if (this.warn > 0) {
        this.warn -= dt;
        return spawned;
      }
      this.age += dt;
      if (this.life !== null) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
      }
      if (this.home) {
        const [hx, hy] = this.home();
        const ang = Math.atan2(hy - this.y, hx - this.x);
        const sp = Math.max(60.0, Math.hypot(this.vx, this.vy));
        const blend = Math.min(1.0, 1.8 * dt);
        this.vx += (Math.cos(ang) * sp - this.vx) * blend;
        this.vy += (Math.sin(ang) * sp - this.vy) * blend;
      }
      this.vy += this.ay * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.wave) {
        this.y += Math.cos(this.age * 7) * this.wave * dt;
      }
      if (this.bounce) {
        const right = inner.x + inner.w;
        const bottom = inner.y + inner.h;
        if (this.x < inner.x + this.r) { this.x = inner.x + this.r; this.vx = Math.abs(this.vx); }
        else if (this.x > right - this.r) { this.x = right - this.r; this.vx = -Math.abs(this.vx); }
        if (this.y < inner.y + this.r) { this.y = inner.y + this.r; this.vy = Math.abs(this.vy); }
        else if (this.y > bottom - this.r) { this.y = bottom - this.r; this.vy = -Math.abs(this.vy); }
      }
      if (this.fuse !== null) {
        this.fuse -= dt;
        if (this.fuse <= 0) {
          this.dead = true;
          for (let k = 0; k < 8; k++) {
            const a = k * Math.PI / 4;
            spawned.push(new Bullet(this.x, this.y, Math.cos(a) * 110, Math.sin(a) * 110, 4, [210, 130, 255]));
          }
        }
      }
      return spawned;
    }

    hits(hx, hy) {
      if (this.warn > 0) return false;
      if (this.w) {
        const box = { x: Math.trunc(this.x - this.w / 2), y: Math.trunc(this.y - this.h / 2), w: this.w, h: this.h };
        return rectsOverlap(box, { x: Math.trunc(hx - 4), y: Math.trunc(hy - 4), w: 8, h: 8 });
      }
      return (this.x - hx) ** 2 + (this.y - hy) ** 2 <= (this.r + 3.5) ** 2;
    }

    draw(c) {
      if (this.w) {
        const bx = Math.trunc(this.x - this.w / 2);
        const by = Math.trunc(this.y - this.h / 2);
        if (this.warn > 0) {
          if (Math.trunc(this.warn * 14) % 2 === 0) {
            strokeRect(c, bx, by, this.w, this.h, [150, 60, 60], 1);
          }
        } else {
          fillRect(c, bx, by, this.w, this.h, this.color);
        }
      } else {
        const dim = this.color.map(v => Math.trunc(v / 3));
        fillCircle(c, Math.trunc(this.x), Math.trunc(this.y), this.r + 2, dim);
        fillCircle(c, Math.trunc(this.x), Math.trunc(this.y), this.r, this.color);
      }
    }
  }

  function randUniform(min, max) {
    return min + Math.random() * (max - min);
  }

  class Pattern {
    constructor(arena, heart, k) {
      this.a = arena;
      this.heart = heart;
      this.k = k;
      this.t = 0.0;
      this.acc = 0.0;
      this.mode = "red";
      this.duration = 5.0;
    }
    due(dt, interval) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= interval) {
        this.acc -= interval;
        n++;
      }
      return n;
    }
    update(dt, bullets) { this.t += dt; }
  }

  class Rain extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const cnt = this.due(dt, 0.30 / this.k);
      for (let i = 0; i < cnt; i++) {
        bullets.push(new Bullet(randUniform(this.a.x + 8, this.a.x + this.a.w - 8), this.a.y - 6, 0, 105 * (0.9 + 0.2 * this.k), 5, [140, 200, 255]));
      }
    }
  }

  class Aimed extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const cnt = this.due(dt, 0.75 / this.k);
      for (let i = 0; i < cnt; i++) {
        const side = ["l", "r", "t"][Math.floor(Math.random() * 3)];
        let x, y;
        if (side === "l") { x = this.a.x - 6; y = randUniform(this.a.y, this.a.y + this.a.h); }
        else if (side === "r") { x = this.a.x + this.a.w + 6; y = randUniform(this.a.y, this.a.y + this.a.h); }
        else { x = randUniform(this.a.x, this.a.x + this.a.w); y = this.a.y - 6; }
        const [hx, hy] = this.heart();
        const ang = Math.atan2(hy - y, hx - x);
        bullets.push(new Bullet(x, y, Math.cos(ang) * 125, Math.sin(ang) * 125, 5, [255, 170, 90]));
      }
    }
  }

  class Spiral extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const cx = this.a.x + this.a.w / 2, cy = this.a.y + this.a.h / 2;
      const cnt = this.due(dt, 0.11 / this.k);
      for (let i = 0; i < cnt; i++) {
        const ang = this.t * 3.2;
        bullets.push(new Bullet(cx, cy, Math.cos(ang) * 95, Math.sin(ang) * 95, 4, [255, 230, 120]));
      }
    }
  }

  class Waves extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const amp = this.a.h / 2 - 14;
      const cy = this.a.y + this.a.h / 2;
      const cnt = this.due(dt, 0.14 / this.k);
      for (let i = 0; i < cnt; i++) {
        const y = cy + Math.sin(this.t * 3) * amp;
        bullets.push(new Bullet(this.a.x + this.a.w + 6, y, -135, 0, 4, [190, 255, 190]));
        bullets.push(new Bullet(this.a.x - 6, 2 * cy - y, 135, 0, 4, [190, 255, 190]));
      }
    }
  }

  class Burst extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 5.5; }
    update(dt, bullets) {
      this.t += dt;
      const cy = this.a.y + this.a.h / 2;
      const cnt = this.due(dt, 1.1 / this.k);
      for (let i = 0; i < cnt; i++) {
        bullets.push(new Bullet(randUniform(this.a.x + 20, this.a.x + this.a.w - 20), randUniform(this.a.y + 10, cy), 0, 30, 6, [210, 130, 255], { fuse: 0.7 }));
      }
    }
  }

  class Bounce extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.started = false; }
    update(dt, bullets) {
      this.t += dt;
      if (!this.started) {
        this.started = true;
        const cy = this.a.y + this.a.h / 2;
        const count = Math.max(2, Math.trunc(4 * this.k));
        for (let i = 0; i < count; i++) {
          const ang = randUniform(0, Math.PI * 2);
          bullets.push(new Bullet(randUniform(this.a.x + 10, this.a.x + this.a.w - 10), randUniform(this.a.y + 10, cy),
                                  Math.cos(ang) * 105, Math.sin(ang) * 105, 6, [130, 190, 255], { bounce: true }));
        }
      }
    }
  }

  class Toll extends Pattern {
    constructor(arena, heart, k) {
      super(arena, heart, k);
      this.mode = "blue";
      this.duration = 6.5;
      this.n = 0;
    }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const speed = -150 * (0.9 + 0.2 * this.k);
      const cnt = this.due(dt, 0.95 / this.k);
      for (let i = 0; i < cnt; i++) {
        if (this.n % 2 === 0) {
          bullets.push(new Bullet(a.x + a.w + 10, a.y + a.h - 7, speed, 0, 0, WHITE, { w: 16, h: 14 }));
        } else {
          const h = a.h - 28;
          bullets.push(new Bullet(a.x + a.w + 10, a.y + h / 2, speed, 0, 0, [255, 200, 120], { w: 16, h }));
        }
        this.n++;
      }
    }
  }

  class Chorus extends Pattern {
    constructor(arena, heart, k) {
      super(arena, heart, k);
      this.parts = [new Spiral(arena, heart, k * 0.7), new Rain(arena, heart, k * 0.8)];
    }
    update(dt, bullets) {
      this.t += dt;
      for (const p of this.parts) p.update(dt, bullets);
    }
  }

  class Pulse extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 5.5; this.n = 0; }
    update(dt, bullets) {
      this.t += dt;
      const cx = this.a.x + this.a.w / 2, cy = this.a.y + this.a.h / 2;
      const cnt = this.due(dt, 1.2 / this.k);
      for (let c = 0; c < cnt; c++) {
        const off = this.n * 0.4;
        for (let i = 0; i < 10; i++) {
          const ang = off + i * (Math.PI * 2) / 10;
          bullets.push(new Bullet(cx, cy, Math.cos(ang) * 85, Math.sin(ang) * 85, 4, [255, 120, 170]));
        }
        this.n++;
      }
    }
  }

  class Lanes extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cnt = this.due(dt, 1.5 / this.k);
      for (let i = 0; i < cnt; i++) {
        const gap = randUniform(a.y + 20, a.y + a.h - 20);
        let y = a.y + 6;
        while (y < a.y + a.h - 4) {
          if (Math.abs(y - gap) > 24) {
            bullets.push(new Bullet(a.x + a.w + 6, y, -95, 0, 4, [150, 255, 170]));
          }
          y += 14;
        }
      }
    }
  }

  class Ember extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cnt = this.due(dt, 0.4 / this.k);
      for (let i = 0; i < cnt; i++) {
        bullets.push(new Bullet(randUniform(a.x + 8, a.x + a.w - 8), a.y + a.h + 4, randUniform(-40, 40), -randUniform(180, 240), 5, [255, 140, 50], { ay: 320 }));
      }
    }
  }

  class Sweep extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; this.n = 0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
      const cnt = this.due(dt, 1.5 / this.k);
      for (let i = 0; i < cnt; i++) {
        if (this.n % 2 === 0) {
          const y = randUniform(a.y + 12, a.y + a.h - 12);
          bullets.push(new Bullet(cx, y, 0, 0, 0, [255, 90, 90], { w: a.w, h: 12, warn: 0.7, life: 0.4 }));
        } else {
          const x = randUniform(a.x + 12, a.x + a.w - 12);
          bullets.push(new Bullet(x, cy, 0, 0, 0, [255, 90, 90], { w: 12, h: a.h, warn: 0.7, life: 0.4 }));
        }
        this.n++;
      }
    }
  }

  class Spin extends Pattern {
    constructor(arena, heart, k) {
      super(arena, heart, k);
      this.duration = 6.0;
      this.arm = [];
      this.arms = k < 1.1 ? 2 : 3;
    }
    update(dt, bullets) {
      this.t += dt;
      const cx = this.a.x + this.a.w / 2, cy = this.a.y + this.a.h / 2;
      if (!this.arm.length) {
        for (let a = 0; a < this.arms; a++) {
          for (let i = 0; i < 6; i++) {
            const b = new Bullet(cx, cy, 0, 0, 4, [255, 210, 120]);
            b.arm_index = [a, i];
            this.arm.push(b);
            bullets.push(b);
          }
        }
      }
      const base = this.t * (1.1 + 0.3 * this.k);
      for (const b of this.arm) {
        const [a, i] = b.arm_index;
        const ang = base + a * (Math.PI * 2) / this.arms;
        const r = 16 + i * 12;
        b.x = cx + Math.cos(ang) * r;
        b.y = cy + Math.sin(ang) * r;
      }
    }
  }

  class Homing extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cnt = this.due(dt, 1.0 / this.k);
      for (let i = 0; i < cnt; i++) {
        const side = ["l", "r", "t"][Math.floor(Math.random() * 3)];
        let x, y;
        if (side === "l") { x = a.x - 6; y = randUniform(a.y, a.y + a.h); }
        else if (side === "r") { x = a.x + a.w + 6; y = randUniform(a.y, a.y + a.h); }
        else { x = randUniform(a.x, a.x + a.w); y = a.y - 6; }
        bullets.push(new Bullet(x, y, 0, 0, 5, [255, 130, 255], { life: 3.2, home: this.heart }));
      }
    }
  }

  class Cross extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.5; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
      const cnt = this.due(dt, 1.7 / this.k);
      for (let i = 0; i < cnt; i++) {
        const [hx, hy] = this.heart();
        bullets.push(new Bullet(cx, hy, 0, 0, 0, [255, 90, 90], { w: a.w, h: 10, warn: 0.8, life: 0.35 }));
        bullets.push(new Bullet(hx, cy, 0, 0, 0, [255, 90, 90], { w: 10, h: a.h, warn: 0.8, life: 0.35 }));
      }
    }
  }

  class Zigzag extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cnt = this.due(dt, 0.24 / this.k);
      for (let i = 0; i < cnt; i++) {
        const y = randUniform(a.y + 10, a.y + a.h - 10);
        if (Math.random() < 0.5) {
          bullets.push(new Bullet(a.x + a.w + 6, y, -105, 0, 4, [120, 220, 255], { wave: 80 }));
        } else {
          bullets.push(new Bullet(a.x - 6, y, 105, 0, 4, [120, 220, 255], { wave: -80 }));
        }
      }
    }
  }

  class Squeeze extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const cnt = this.due(dt, 2.0 / this.k);
      for (let i = 0; i < cnt; i++) {
        for (const fromLeft of [true, false]) {
          const gap = randUniform(a.y + 30, a.y + a.h - 30);
          const topH = gap - 22 - a.y;
          const botH = (a.y + a.h) - (gap + 22);
          const x = fromLeft ? a.x - 8 : a.x + a.w + 8;
          const vx = fromLeft ? 80 : -80;
          const color = [255, 200, 90];
          bullets.push(new Bullet(x, a.y + topH / 2, vx, 0, 0, color, { w: 14, h: topH }));
          bullets.push(new Bullet(x, gap + 22 + botH / 2, vx, 0, 0, color, { w: 14, h: botH }));
        }
      }
    }
  }

  const PATTERNS = {
    rain: Rain, aimed: Aimed, spiral: Spiral, waves: Waves, burst: Burst,
    bounce: Bounce, toll: Toll, chorus: Chorus, pulse: Pulse, lanes: Lanes,
    ember: Ember, sweep: Sweep, spin: Spin, homing: Homing, cross: Cross,
    zigzag: Zigzag, squeeze: Squeeze
  };

  // =========================================================================
  // 12. GAME STATES: BATTLE, PAUSE, SHOP, OVERWORLD, INTRO, ENDINGS, ETC.
  // =========================================================================
  class State {
    constructor(game) { this.game = game; }
    handleKey(code, event) {}
    update(dt) {}
    draw(c) {}
  }

  const BAR_X0 = 60, BAR_W = 520;

  class BattleState extends State {
    constructor(game, overworld, monster) {
      super(game);
      this.ow = overworld;
      this.mon = monster;
      this.d = ENEMIES[monster.key];
      this.hp = this.d.hp;
      this.BTN = ["FIGHT", "ACT", "ITEM", "MERCY"];
      this.MENU_BOX = { x: 40, y: 270, w: 560, h: 100 };
      this.ARENA    = { x: 220, y: 236, w: 200, h: 134 };
      this.TEXT_W   = 490;
      this.t = 0.0;
      this.fade = 255.0;
      this.sel = 0;
      this.sub = 0;
      this.mercy = 0;
      this.anger = 0;
      this.used = new Set();
      this.turn = 0;
      this.phaseIdx = 0;
      this.flavorI = Math.floor(Math.random() * 6);
      this.menuText = "";
      this.shake = 0.0;
      this.hitTimer = 0.0;
      this.hitDmg = 0;
      this.barX = 0.0;
      this.queue = [];
      this.after = null;
      this.writer = new Typewriter("", 40, "blip");
      this.phase = "text";
      this.boxP = 0.0;
      this.boxGoal = 0.0;
      this.bullets = [];
      this.pattern = null;
      this.hx = 0.0;
      this.hy = 0.0;
      this.hvy = 0.0;
      this.mode = "red";
      this.inv = 0.0;
      this.dodgeT = 0.0;
      this.bubble = null;
      this.bubbleWait = 0.0;
      this.deadT = 0.0;
      this.shards = [];
      this.stars = Array.from({ length: 40 }, () => [randUniform(0, W), randUniform(0, H), randUniform(8, 28)]);
      AUDIO.playMusic(this.d.music);
      this.say([this.d.intro], () => this.showMenuFresh());
    }

    say(lines, after) {
      const pages = [];
      for (const ln of lines) pages.push(...paginate(ln, 20, this.TEXT_W, 3));
      this.queue = pages;
      this.after = after;
      this.phase = "text";
      this.writer = new Typewriter(this.queue.shift(), 40, "blip");
    }

    showMenuFresh() {
      const flavors = this.d.flavor;
      const text = flavors[this.flavorI % flavors.length];
      this.flavorI++;
      this.menuText = paginate(text, 20, this.TEXT_W, 3)[0];
      this.showMenu();
    }

    showMenu() {
      this.phase = "menu";
      this.writer = new Typewriter(this.menuText, 40, "blip");
    }

    choose() {
      if (this.sel === 0) {
        this.phase = "fight";
        this.barX = 0.0;
      } else if (this.sel === 1) {
        this.phase = "act";
        this.sub = 0;
      } else if (this.sel === 2) {
        if (this.game.items.length) {
          this.phase = "item";
          this.sub = 0;
        } else {
          AUDIO.sfx("error");
          this.say(["You have no items."], () => this.showMenu());
        }
      } else {
        this.doMercy();
      }
    }

    doAct(i) {
      let [label, text, gain, anger] = this.d.acts[i];
      text = text.replace("{name}", this.game.name);
      if (gain) {
        if (this.used.has(label)) {
          text = "You try that again, but nothing changes.";
        } else {
          this.used.add(label);
          this.mercy = Math.min(100, this.mercy + gain);
          if (this.mercy >= 100) {
            text += "\n(It looks ready to be spared.)";
          }
        }
      }
      this.anger = Math.min(3, this.anger + anger);
      this.say([text], () => this.enemyTurn());
    }

    doMercy() {
      if (this.mercy >= 100) {
        this.game.gold += this.d.gold;
        const lines = [this.d.spared, `You earned ${this.d.gold} gold.`];
        if (this.d.boss) lines.push("You earned 1 UT!");
        this.say(lines, () => this.finish("spare"));
      } else {
        this.say([this.d.spare_fail], () => this.enemyTurn());
      }
    }

    useItem(i) {
      const msg = this.game.useItem(i);
      this.say([msg], () => this.enemyTurn());
    }

    doHit() {
      const g = this.game;
      const acc = Math.max(0.0, 1 - Math.abs(this.barX - BAR_W / 2) / (BAR_W / 2));
      let dmg = 0;
      if (acc >= 0.08) {
        dmg = Math.max(1, Math.round(2 + acc * (9 + g.atk)) + Math.trunc(g.atk / 2) - this.d.defense);
      }
      this.hitDmg = dmg;
      this.hp -= dmg;
      this.shake = dmg ? 0.6 : 0.0;
      this.hitTimer = 1.1;
      this.phase = "fight_hit";
      AUDIO.sfx("slash");
      if (dmg) g.shake(5, 0.2);
    }

    winKill() {
      const g = this.game;
      const exp = this.d.exp, gold = this.d.gold;
      const before = g.lv;
      g.gainExp(exp);
      g.gold += gold;
      const lines = [this.d.win, `You earned ${exp} EXP and ${gold} gold.`];
      if (g.lv > before) {
        AUDIO.sfx("heal");
        lines.push(`Your LV rose to ${g.lv}! Max HP up!`);
      }
      if (this.d.boss) lines.push("You earned 1 UT!");
      this.say(lines, () => this.finish("kill"));
    }

    finish(result) {
      const g = this.game;
      const m = this.mon;
      m.alive = false;
      g.defeated.add(m.uid);
      if (this.d.boss) g.awardUt(1);
      if (result === "kill") g.kills++;
      else g.spares++;
      if (this.d.flag) g.flags[this.d.flag] = true;

      const role = this.d.role;
      if (role === "act1") {
        const kind = result === "kill" ? "hollow" : (g.kills === 0 ? "mercy" : "neutral");
        g.changeState(new EndingState(g, kind));
      } else if (role === "act2") {
        if (result === "kill") {
          g.changeState(new EndingState(g, "overgrown"));
        } else if (g.kills > 0) {
          g.changeState(new EndingState(g, "rootbound"));
        } else {
          g.changeState(new ChoiceState(
            g, "The roots fall quiet. Wick's voice drifts down the stair: 'The surface is open. What will you do, little one?'",
            ["Climb to the surface", "Stay and tend the cave"],
            [() => new EndingState(g, "dawn"), () => new EndingState(g, "keeper")]
          ));
        }
      } else if (role === "act3") {
        const kind = result === "kill" ? "eclipse" : (g.kills === 0 ? "homecoming" : "wanderer");
        g.changeState(new EndingState(g, kind));
      } else {
        this.ow.fade = 255.0;
        this.ow.fading = "in";
        this.ow.playRoomMusic();
        g.changeState(this.ow);
      }
    }

    computePhase() {
      let idx = 0;
      for (let i = 0; i < this.d.phase_hp.length; i++) {
        const frac = this.d.phase_hp[i];
        const tn = this.d.phase_turn[i];
        if (this.hp <= this.d.hp * frac || this.turn >= tn) idx = i + 1;
      }
      return idx;
    }

    enemyTurn() {
      const idx = this.computePhase();
      if (idx > this.phaseIdx) {
        this.phaseIdx = idx;
        AUDIO.sfx("bell");
        this.game.shake(8, 0.5);
        this.say([this.d.phase_text[idx - 1]], () => this.beginTalk());
        return;
      }
      this.beginTalk();
    }

    pickTalk() {
      const talk = this.d.talk;
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      if (this.anger > 0 && Math.random() < 0.6) return pick(talk.angry);
      if (this.mercy >= 100) return pick(talk.calm);
      if (this.mercy >= 50) return pick(talk.mid);
      return pick(talk.base);
    }

    beginTalk() {
      this.turn++;
      const line = wrap(this.pickTalk(), 16, 176).join("\n");
      this.bubble = new Typewriter(line, 30, "blip_low");
      this.bubbleWait = 0.0;
      this.phase = "talk";
    }

    startDodge() {
      const lists = this.d.phases;
      const seq = lists[Math.min(this.phaseIdx, lists.length - 1)];
      const name = seq[this.turn % seq.length];
      const k = Math.max(0.45, Math.min(1.6, 1.0 + 0.25 * this.anger - 0.5 * this.mercy / 100));
      const inner = inflateRect(this.ARENA, -12, -12);
      this.pattern = new PATTERNS[name](inner, () => [this.hx, this.hy], k);
      this.mode = this.pattern.mode;
      this.hx = inner.x + inner.w / 2;
      this.hy = this.mode === "blue" ? (inner.y + inner.h - 5) : (inner.y + inner.h - 24);
      this.hvy = 0.0;
      this.bullets = [];
      this.dodgeT = 0.0;
      this.inv = 0.8;
      this.boxGoal = 1.0;
      this.phase = "dodge";
    }

    updateHeart(dt) {
      const right = keysDown.has("ArrowRight") || keysDown.has("KeyD") ? 1 : 0;
      const left  = keysDown.has("ArrowLeft")  || keysDown.has("KeyA") ? 1 : 0;
      const down  = keysDown.has("ArrowDown")  || keysDown.has("KeyS") ? 1 : 0;
      const up    = keysDown.has("ArrowUp")    || keysDown.has("KeyW") ? 1 : 0;
      const dx = right - left;
      const dy = down - up;
      const slow = keysDown.has("KeyX") || keysDown.has("ShiftLeft") || keysDown.has("ShiftRight");
      const sp = 150 * (slow ? 0.5 : 1.0);
      const inner = inflateRect(this.ARENA, -12, -12);
      const leftB = inner.x + 5, rightB = inner.x + inner.w - 5;
      const topB = inner.y + 5, bottomB = inner.y + inner.h - 5;
      this.hx += dx * sp * dt;
      if (this.mode === "red") {
        this.hy += dy * sp * dt;
      } else {
        const jump = up || keysDown.has("KeyZ") || keysDown.has("Space");
        if (jump && this.hy >= bottomB - 0.5) {
          this.hvy = -300;
        }
        this.hvy += 820 * dt;
        this.hy += this.hvy * dt;
        if (this.hy >= bottomB) { this.hy = bottomB; this.hvy = 0.0; }
        if (this.hy <= topB) { this.hy = topB; this.hvy = Math.max(0.0, this.hvy); }
      }
      this.hx = Math.max(leftB, Math.min(rightB, this.hx));
      this.hy = Math.max(topB, Math.min(bottomB, this.hy));
    }

    updateBullets(dt) {
      const inner = inflateRect(this.ARENA, -12, -12);
      const limit = inflateRect(this.ARENA, 120, 120);
      const keep = [], spawned = [];
      for (const b of this.bullets) {
        spawned.push(...b.update(dt, inner));
        if (b.dead || !rectContainsPoint(limit, b.x, b.y)) continue;
        if (this.inv <= 0 && b.hits(this.hx, this.hy)) {
          this.hurt();
        }
        keep.push(b);
      }
      this.bullets = keep.concat(spawned);
      this.inv = Math.max(0.0, this.inv - dt);
    }

    hurt() {
      const g = this.game;
      const dmg = Math.max(1, this.d.atk + Math.min(2, this.phaseIdx) - g.defense);
      g.hp -= dmg;
      this.inv = 1.1;
      AUDIO.sfx("hit");
      g.shake(6, 0.25);
      g.flash([255, 0, 0], 0.15);
      if (g.hp <= 0) {
        g.hp = 0;
        this.phase = "dying";
        this.deadT = 0.0;
        this.bullets = [];
        AUDIO.playMusic(null);
      }
    }

    moveBox(dt) {
      if (this.boxP < this.boxGoal) this.boxP = Math.min(this.boxGoal, this.boxP + dt * 5);
      else if (this.boxP > this.boxGoal) this.boxP = Math.max(this.boxGoal, this.boxP - dt * 5);
    }

    boxRect() {
      const a = this.MENU_BOX, b = this.ARENA, p = this.boxP;
      return {
        x: Math.trunc(a.x + (b.x - a.x) * p),
        y: Math.trunc(a.y + (b.y - a.y) * p),
        w: Math.trunc(a.w + (b.w - a.w) * p),
        h: Math.trunc(a.h + (b.h - a.h) * p),
      };
    }

    handleKey(code) {
      const confirm = CONFIRM_KEYS.has(code);
      const ph = this.phase;
      if (ph === "text") {
        if (confirm) {
          if (!this.writer.done) this.writer.finish();
          else if (this.queue.length) this.writer = new Typewriter(this.queue.shift(), 40, "blip");
          else this.after();
        }
      } else if (ph === "menu") {
        if (LEFT_KEYS.has(code)) { this.sel = (this.sel + 3) % 4; AUDIO.sfx("select"); }
        else if (RIGHT_KEYS.has(code)) { this.sel = (this.sel + 1) % 4; AUDIO.sfx("select"); }
        else if (confirm) { AUDIO.sfx("confirm"); this.choose(); }
      } else if (ph === "act" || ph === "item") {
        const len = ph === "act" ? this.d.acts.length : this.game.items.length;
        if (UP_KEYS.has(code)) { this.sub = (this.sub + len - 1) % len; AUDIO.sfx("select"); }
        else if (DOWN_KEYS.has(code)) { this.sub = (this.sub + 1) % len; AUDIO.sfx("select"); }
        else if (BACK_KEYS.has(code)) this.showMenu();
        else if (confirm) {
          AUDIO.sfx("confirm");
          if (ph === "act") this.doAct(this.sub);
          else this.useItem(this.sub);
        }
      } else if (ph === "fight") {
        if (confirm) this.doHit();
      } else if (ph === "talk") {
        if (confirm) {
          if (!this.bubble.done) this.bubble.finish();
          else this.startDodge();
        }
      }
    }

    update(dt) {
      this.t += dt;
      this.fade = Math.max(0.0, this.fade - 600 * dt);
      this.shake = Math.max(0.0, this.shake - dt);
      for (const s of this.stars) {
        s[1] += s[2] * dt;
        if (s[1] > H) { s[0] = randUniform(0, W); s[1] = 0; }
      }
      const ph = this.phase;
      if (ph === "text" || ph === "menu") {
        this.writer.update(dt);
      } else if (ph === "fight") {
        this.barX += 420 * dt;
        if (this.barX >= BAR_W) { this.barX = BAR_W; this.doHit(); }
      } else if (ph === "fight_hit") {
        this.hitTimer -= dt;
        if (this.hitTimer <= 0) {
          if (this.hp <= 0) this.winKill();
          else this.enemyTurn();
        }
      } else if (ph === "talk") {
        this.bubble.update(dt);
        if (this.bubble.done) {
          this.bubbleWait += dt;
          if (this.bubbleWait > 1.3) this.startDodge();
        }
      } else if (ph === "dodge") {
        this.moveBox(dt);
        if (this.boxP >= 1.0) {
          this.updateHeart(dt);
          this.dodgeT += dt;
          this.pattern.update(dt, this.bullets);
          this.updateBullets(dt);
          if (this.dodgeT >= this.pattern.duration && this.phase === "dodge") {
            this.boxGoal = 0.0;
            this.bullets = [];
            this.phase = "retract";
          }
        }
      } else if (ph === "retract") {
        this.moveBox(dt);
        if (this.boxP <= 0.0) this.showMenuFresh();
      } else if (ph === "dying") {
        this.deadT += dt;
        if (this.deadT >= 0.6 && !this.shards.length) {
          AUDIO.sfx("break");
          this.shards = Array.from({ length: 6 }, () => [this.hx, this.hy, randUniform(-90, 90), randUniform(-160, -40)]);
        }
        for (const s of this.shards) {
          s[0] += s[2] * dt;
          s[1] += s[3] * dt;
          s[3] += 380 * dt;
        }
        if (this.deadT >= 2.4) this.game.changeState(new GameOverState(this.game));
      }
    }

    draw(c) {
      fillRect(c, 0, 0, W, H, BLACK);
      for (const [sx, sy] of this.stars) {
        fillRect(c, Math.trunc(sx), Math.trunc(sy), 2, 2, [40, 40, 72]);
      }
      const offs = this.shake > 0 ? Math.trunc(Math.sin(this.t * 60) * this.shake * 16) : 0;
      if (this.hp > 0 && this.phase !== "dying") {
        const cy = this.d.bcy + Math.trunc(Math.sin(this.t * 2) * 4);
        this.d.draw(c, Math.trunc(W / 2) + offs, cy, this.t, this.d.bscale);
      }
      if (this.phase === "fight_hit") {
        if (this.hitTimer > 0.75) {
          for (let i = 0; i < 3; i++) {
            drawLine(c, [W / 2 - 50 + i * 14, 90], [W / 2 + 10 + i * 14, 200], WHITE, 3);
          }
        }
        const bx = W / 2 - 60, by = 222, bw = 120, bh = 12;
        fillRect(c, bx, by, bw, bh, [120, 0, 0]);
        const frac = Math.max(0, this.hp) / this.d.hp;
        fillRect(c, bx, by, Math.trunc(bw * frac), bh, GREEN);
        const txt = this.hitDmg === 0 ? "MISS" : String(this.hitDmg);
        drawTextCenter(c, txt, W / 2, 200 - Math.trunc((1 - this.hitTimer) * 14), 30, this.hitDmg ? RED : GREY);
      }
      if (this.phase === "talk") {
        const lines = this.bubble.text.split("\n");
        const bh = 16 + 20 * lines.length;
        const br = { x: W / 2 + this.d.bubble_dx, y: 50, w: 200, h: bh };
        fillRect(c, br.x, br.y, br.w, br.h, WHITE);
        fillPolygon(c, [[br.x, br.y + 20], [br.x - 14, br.y + 28], [br.x, br.y + 34]], WHITE);
        drawTyped(c, 16, this.bubble.text, this.bubble.shown, br.x + 12, br.y + 8, 20, BLACK);
      }
      const box = this.boxRect();
      drawPanel(c, box);
      const ph = this.phase;
      if (ph === "text" || ph === "menu") {
        drawText(c, "*", 64, 286, 20, WHITE);
        drawTyped(c, 20, this.writer.text, this.writer.shown, 86, 286, 24);
      } else if (ph === "act") {
        drawMenuList(c, 20, this.d.acts.map(a => a[0]), this.sub, 90, 286, 26);
      } else if (ph === "item") {
        drawMenuList(c, 20, this.game.items, this.sub, 90, 286, 26);
      } else if (ph === "fight") {
        fillRect(c, BAR_X0, 300, BAR_W, 36, [40, 40, 40]);
        fillRect(c, BAR_X0 + BAR_W / 2 - 20, 300, 40, 36, GREEN);
        strokeRect(c, BAR_X0, 300, BAR_W, 36, WHITE, 3);
        fillRect(c, BAR_X0 + Math.trunc(this.barX) - 3, 292, 6, 52, YELLOW);
      } else if ((ph === "dodge" || ph === "retract") && this.boxP >= 1.0) {
        for (const b of this.bullets) b.draw(c);
        if (this.inv <= 0 || Math.trunc(this.t * 20) % 2 === 0) {
          drawHeart(c, this.hx, this.hy + 1, 6, this.mode === "blue" ? BLUE : RED);
        }
      } else if (ph === "dying") {
        if (!this.shards.length) drawHeart(c, this.hx, this.hy + 1, 6, RED);
        for (const [sx, sy] of this.shards) {
          fillPolygon(c, [[sx, sy - 3], [sx + 3, sy + 3], [sx - 3, sy + 3]], RED);
        }
      }

      const g = this.game;
      const statStr = `${g.name}  LV ${g.lv}   HP`;
      drawText(c, statStr, 40, 382, 20, WHITE);
      const statW = measureText(statStr, 20);
      const hpX = 40 + statW + 12;
      fillRect(c, hpX, 384, 90, 20, [120, 0, 0]);
      fillRect(c, hpX, 384, Math.trunc(90 * Math.max(0, g.hp) / g.max_hp), 20, YELLOW);
      drawText(c, `${Math.max(0, g.hp)} / ${g.max_hp}`, hpX + 90 + 12, 382, 20, WHITE);

      for (let i = 0; i < this.BTN.length; i++) {
        const label = this.BTN[i];
        const rx = 40 + i * 142, ry = 420, rw = 124, rh = 42;
        const selected = i === this.sel;
        const color = selected ? YELLOW : ORANGE;
        strokeRect(c, rx, ry, rw, rh, color, 3);
        const tc = (label === "MERCY" && this.mercy >= 100) ? YELLOW : color;
        drawTextCenter(c, label, rx + rw / 2 + 8, ry + rh / 2, 20, tc);
        if (selected && this.phase === "menu") {
          drawHeart(c, rx + 18, ry + rh / 2, 7);
        }
      }
      if (this.fade > 0) {
        fillRect(c, 0, 0, W, H, BLACK, this.fade / 255);
      }
    }
  }

  function drawStats(c, g, rect, size) {
    drawPanel(c, rect);
    const nxt = g.expToNext();
    const lines = [
      g.name, `LV  ${g.lv}`, `HP  ${g.hp}/${g.max_hp}`, `ATK ${g.atk}`,
      `DEF ${g.defense}`, `EXP ${g.exp}`, `NEXT ${nxt ? nxt : "-"}`, `GOLD ${g.gold}`
    ];
    lines.forEach((line, n) => {
      drawText(c, line, rect.x + 16, rect.y + 14 + n * 24, size, n === 0 ? YELLOW : WHITE);
    });
  }

  class PauseState extends State {
    constructor(game, ow) {
      super(game);
      this.ow = ow;
      this.sub = 0;
      this.msg = "";
      AUDIO.sfx("confirm");
    }

    handleKey(code) {
      const g = this.game;
      if (PAUSE_KEYS.has(code) || BACK_KEYS.has(code)) {
        g.changeState(this.ow);
      } else if (g.items.length && UP_KEYS.has(code)) {
        this.sub = (this.sub + g.items.length - 1) % g.items.length;
        AUDIO.sfx("select");
      } else if (g.items.length && DOWN_KEYS.has(code)) {
        this.sub = (this.sub + 1) % g.items.length;
        AUDIO.sfx("select");
      } else if (CONFIRM_KEYS.has(code) && g.items.length) {
        this.msg = g.useItem(this.sub);
        this.sub = Math.min(this.sub, Math.max(0, g.items.length - 1));
      }
    }

    draw(c) {
      const g = this.game;
      fillRect(c, 0, 0, W, H, BLACK);
      drawStats(c, g, { x: 24, y: 24, w: 190, h: 220 }, 20);
      const eq = { x: 24, y: 256, w: 190, h: 100 };
      drawPanel(c, eq);
      drawText(c, "WEAPON " + g.weapon, eq.x + 12, eq.y + 12, 16, WHITE);
      drawText(c, "ARMOR  " + g.armor, eq.x + 12, eq.y + 38, 16, WHITE);
      const pages = PAGE_FLAGS.filter(f => g.flags[f]).length;
      drawText(c, `PAGES  ${pages}/3`, eq.x + 12, eq.y + 64, 16, WHITE);

      const lst = { x: 230, y: 24, w: 386, h: 332 };
      drawPanel(c, lst);
      drawText(c, "ITEMS", lst.x + 16, lst.y + 10, 20, YELLOW);
      if (!g.items.length) {
        drawText(c, "(empty)", lst.x + 40, lst.y + 48, 20, GREY);
      }
      g.items.forEach((name, n) => {
        drawText(c, name, lst.x + 44, lst.y + 46 + n * 32, 20, WHITE);
      });
      if (g.items.length) {
        drawHeart(c, lst.x + 26, lst.y + 56 + this.sub * 32, 7);
      }
      const info = { x: 24, y: 372, w: 592, h: 84 };
      drawPanel(c, info);
      const text = this.msg || (g.items.length ? ITEMS[g.items[this.sub]].desc : "Nothing to carry.");
      drawTyped(c, 16, wrap(text, 16, 560).slice(0, 3).join("\n"), 999, info.x + 16, info.y + 10, 22);
      drawText(c, "Z: use / equip     C or X: close", 24, 460, 16, GREY);
    }
  }

  class ShopState extends State {
    constructor(game, ow, key) {
      super(game);
      this.ow = ow;
      this.shop = SHOPS[key];
      this.sub = 0;
      this.t = 0.0;
      this.msg = "Take your time!";
      AUDIO.playMusic(this.shop.music);
    }

    leave() {
      this.ow.playRoomMusic();
      this.game.changeState(this.ow);
    }

    handleKey(code) {
      const g = this.game;
      const stock = this.shop.stock;
      if (BACK_KEYS.has(code) || PAUSE_KEYS.has(code)) {
        this.leave();
      } else if (UP_KEYS.has(code)) {
        this.sub = (this.sub + stock.length - 1) % stock.length;
        AUDIO.sfx("select");
      } else if (DOWN_KEYS.has(code)) {
        this.sub = (this.sub + 1) % stock.length;
        AUDIO.sfx("select");
      } else if (CONFIRM_KEYS.has(code)) {
        const name = stock[this.sub];
        const price = ITEMS[name].price;
        if (g.gold < price) {
          AUDIO.sfx("error");
          this.msg = "Not enough gold, friend.";
        } else if (g.items.length >= INVENTORY_MAX) {
          AUDIO.sfx("error");
          this.msg = "Your pockets are full!";
        } else {
          g.gold -= price;
          g.items.push(name);
          AUDIO.sfx("buy");
          this.msg = `Sold! One ${name}.`;
        }
      }
    }

    update(dt) { this.t += dt; }

    draw(c) {
      const g = this.game;
      const stock = this.shop.stock;
      fillRect(c, 0, 0, W, H, [22, 16, 12]);
      this.shop.art(c, 520, 130, this.t);
      const lst = { x: 24, y: 24, w: 400, h: 330 };
      drawPanel(c, lst);
      drawText(c, this.shop.title, lst.x + 16, lst.y + 10, 20, YELLOW);
      stock.forEach((name, n) => {
        drawText(c, name, lst.x + 44, lst.y + 48 + n * 40, 20, WHITE);
        drawText(c, `${ITEMS[name].price}G`, lst.x + lst.w - 70, lst.y + 52 + n * 40, 16, YELLOW);
      });
      drawHeart(c, lst.x + 26, lst.y + 58 + this.sub * 40, 7);
      const goldBox = { x: 440, y: 200, w: 176, h: 60 };
      drawPanel(c, goldBox);
      drawText(c, `GOLD ${g.gold}`, goldBox.x + 16, goldBox.y + 18, 20, WHITE);
      const info = { x: 24, y: 372, w: 592, h: 84 };
      drawPanel(c, info);
      const desc = ITEMS[stock[this.sub]].desc;
      drawTyped(c, 16, desc + "\n" + this.msg, 999, info.x + 16, info.y + 14, 24);
      drawText(c, "Z: buy     X: leave", 24, 460, 16, GREY);
    }
  }
